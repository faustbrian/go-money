schema_version: 1
tool_version: v2.1.1
tool_checksums_sha256: 4e0a38f76cbff547541f3164a0e59e958cf2f62d7b5cea19d7a4d1c51fe5e977
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v2.txt
operations:
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: no-float
        timeout: 5m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseMoney$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzAllocationConservation$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzWeightedAllocationConservation$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzRate$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["./encoding"]
        fuzz: '^FuzzVersionedJSON$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["./encoding"]
        fuzz: '^FuzzPostgreSQLNumeric$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["./format"]
        fuzz: '^FuzzLocale$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
